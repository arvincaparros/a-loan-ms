services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: aloanms
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ALoanMS
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aloanms"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
